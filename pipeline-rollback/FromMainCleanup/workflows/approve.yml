# Class Library — approval pipeline
# Register this file as the feature to dev validation pipeline in Azure DevOps.
# PR creation does nothing. Approval automation queues this pipeline once the PR is approved.

trigger: none

pr: none

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
- template: ../variables/common.yml

stages:
- template: ../templates/change-detection.yml
  parameters:
    mode: pr
- template: ../templates/build.yml
- template: ../templates/test.yml
- template: ../templates/merge.yml
- template: ../templates/carry-forward.yml
  parameters:
    dependsOn:
    - Build
    - Merge
    stageCondition: eq(dependencies.Merge.result, 'Succeeded')
    republishArtifact: false
    createPullRequest: true
- template: ../templates/failure.yml
  parameters:
    dependsOn:
    - ChangeDetection
    - Build
    - Test
    - Merge
    - CarryForward
