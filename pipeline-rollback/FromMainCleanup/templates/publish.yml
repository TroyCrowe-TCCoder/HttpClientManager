# Stage template — publish the package built on the current run to Azure Artifacts.

stages:
- stage: Publish
  displayName: Publish
  dependsOn:
  - ChangeDetection
  condition: |
    and(
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      eq(dependencies.ChangeDetection.result, 'Succeeded')
    )
  variables:
    codeChanged: $[ stageDependencies.ChangeDetection.Detect.outputs['setvar.codeChanged'] ]
  jobs:
  - job: DownloadPromotedArtifact
    displayName: Download promoted package artifact
    pool:
      vmImage: ubuntu-latest
    condition: eq(variables['codeChanged'], 'true')
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download promoted package artifact from dev promotion pipeline
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: $(devPromotionPipelineId)
        branchName: refs/heads/dev
        buildVersionToDownload: latestFromBranch
        artifactName: $(packageArtifactName)
        targetPath: $(Pipeline.Workspace)/nuget-drop

  - job: SetPublishState
    displayName: Set publish state
    dependsOn:
    - DownloadPromotedArtifact
    condition: always()
    pool:
      vmImage: ubuntu-latest
    variables:
      downloadResult: $[ dependencies.DownloadPromotedArtifact.result ]
    steps:
    - checkout: none

    - task: PowerShell@2
      displayName: Set publish output variables
      name: setvar
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $codeChanged = '$(codeChanged)'
          $downloadResult = '$(downloadResult)'
          $artifactsAvailable = 'false'

          if ($codeChanged -eq 'true') {
            if ($downloadResult -eq 'Succeeded') {
              $artifactsAvailable = 'true'
            } else {
              Write-Error "Publishing was required but the promoted artifact could not be downloaded. Result: $downloadResult"
              exit 1
            }
          }

          Write-Host "##vso[task.setvariable variable=artifactsAvailable;isOutput=true]$artifactsAvailable"

  - job: PublishPackage
    displayName: Publish package to Azure Artifacts
    dependsOn:
    - SetPublishState
    condition: eq(dependencies.SetPublishState.outputs['setvar.artifactsAvailable'], 'true')
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none

    - task: NuGetAuthenticate@1
      displayName: Authenticate with Azure Artifacts

    - task: DotNetCoreCLI@2
      displayName: Publish to $(artifactsFeedName)
      inputs:
        command: push
        packagesToPush: $(Pipeline.Workspace)/nuget-drop/*.nupkg
        nuGetFeedType: internal
        publishVstsFeed: $(artifactsFeedName)
        allowPackageConflicts: false
