# Class Library — dev pipeline (approval-triggered single run)
# App type: Class Library (.NET NuGet package or shared assembly)
# Environment: dev
# Register ONLY this file as a pipeline in Azure DevOps.
#
# TRIGGER MODEL
#   This pipeline is registered as a branch policy Build Validation on 'dev'
#   with "Trigger automatically" set to OFF.
#   Flow:
#     1. Developer creates a PR targeting dev — nothing runs
#     2. Reviewer approves the PR
#     3. The approved PR is queued from the PR context
#     4. ADO populates System.PullRequest.PullRequestId automatically from the PR context
#
# PIPELINE SEQUENCE (one run, five stages)
#   Stage 1 — ChangeDetection : detect if code changed, set codeChanged flag
#   Stage 2 — Build           : only if codeChanged == true
#   Stage 3 — Test            : only if codeChanged == true AND Build passed
#   Stage 4 — Merge           : always — gated on ChangeDetection succeeded;
#                               if codeChanged was true, Build and Test must also have passed
#   Stage 5 — CarryForward    : always if Merge succeeded;
#                               re-publishes artifact only if codeChanged == true,
#                               always creates the dev→main promotion PR

trigger: none

pr: none

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
- template: ../variables/common.yml

stages:

# — Stage 1: ChangeDetection ——————————————————————————————————————————————————
- template: httpclientmanager-02-change-detection.yml

# — Stage 2-3: Build and Test (code changes only) ——————————————————————————————
- template: httpclientmanager-03-build.yml
- template: httpclientmanager-04-test.yml

# — Stage 4: Merge —————————————————————————————————————————————————————————————
- template: httpclientmanager-06-merge.yml

# — Stage 5: CarryForward ——————————————————————————————————————————————————————
- stage: CarryForward
  displayName: Carry forward to main
  dependsOn:
  - Merge
  - ChangeDetection
  condition: eq(dependencies.Merge.result, 'Succeeded')
  jobs:

  - job: RepublishArtifact
    displayName: Re-publish NuGet artifact (code changes only)
    pool:
      vmImage: ubuntu-latest
    variables:
      codeChanged: $[ stageDependencies.ChangeDetection.Detect.outputs['setvar.codeChanged'] ]
    condition: eq(variables['codeChanged'], 'true')
    steps:
    - checkout: none

    - task: DownloadPipelineArtifact@2
      displayName: Download nuget-drop from this run
      inputs:
        buildType: current
        artifactName: $(buildPackageArtifactName)
        targetPath: $(Pipeline.Workspace)/nuget-drop

    - task: PublishPipelineArtifact@1
      displayName: Re-publish nuget-drop on this run
      inputs:
        targetPath: $(Pipeline.Workspace)/nuget-drop
        artifactName: $(packageArtifactName)

  - job: PromotePR
    displayName: Create dev to main promotion PR
    dependsOn:
    - RepublishArtifact
    condition: in(dependencies.RepublishArtifact.result, 'Succeeded', 'Skipped')
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: none
    - template: ../templates/auto-pr-chain.yml
      parameters:
        adoOrg: 'tcrowe0170'
        adoProject: 'HttpClientManager'
        repositoryId: 'HttpClientManager'
        sourceBranch: 'dev'
        targetBranch: '$(devNextBranch)'
