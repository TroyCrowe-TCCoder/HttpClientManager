trigger:
  branches:
    include:
      - main

pr: none

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
- template: ../variables/common.yml

pool:
  vmImage: ubuntu-latest

steps:
# Download the NuGet artifact produced during the Feature=>Dev PR validation.
# No rebuild — the package was already built, tested, and stored at that point.
- task: DownloadPipelineArtifact@2
  displayName: Download NuGet artifact from dev build
  inputs:
    buildType: specific
    project: $(System.TeamProjectId)
    definition: 13
    buildVersionToDownload: latestFromBranch
    branchName: refs/heads/dev
    artifactName: $(packageArtifactName)
    targetPath: $(Pipeline.Workspace)/nuget-drop

- task: NuGetAuthenticate@1
  displayName: Authenticate with Azure Artifacts

- task: DotNetCoreCLI@2
  displayName: Publish to CaptiveInnovations feed
  inputs:
    command: push
    packagesToPush: $(Pipeline.Workspace)/nuget-drop/*.nupkg
    nuGetFeedType: internal
    publishVstsFeed: $(artifactsFeedName)
    allowPackageConflicts: false
