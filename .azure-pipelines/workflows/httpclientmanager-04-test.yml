# Class Library — test
# App type: Class Library (.NET NuGet package or shared assembly)
# Environment: dev
# Step 4 of 5 — Do NOT register this file as a pipeline. Loaded by httpclientmanager-dev.yml.
# Variables (buildConfiguration, solutionPath) are resolved from common.yml
# loaded by the httpclientmanager-dev.yml entry-point.

stages:
- stage: Test
  displayName: Test
  dependsOn: Build
  condition: |
    and(
      succeeded('Build'),
      eq(variables['Build.Reason'], 'PullRequest')
    )
  jobs:
  - job: RunTests
    displayName: Run unit tests
    pool:
      vmImage: ubuntu-latest
    steps:

    - checkout: self

    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: 10.0.x
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: $(solutionPath)

    - task: DotNetCoreCLI@2
      displayName: Run tests
      inputs:
        command: test
        projects: $(solutionPath)
        arguments: --configuration $(buildConfiguration) --verbosity normal
