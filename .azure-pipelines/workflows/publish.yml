# Class Library — main release pipeline
# Register this file as the main release pipeline in Azure DevOps.

trigger:
  branches:
    include:
      - main

pr: none

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
- template: ../variables/common.yml

stages:
- template: ../templates/change-detection.yml
  parameters:
    mode: main
- template: ../templates/publish.yml
- template: ../templates/failure.yml
  parameters:
    dependsOn:
    - ChangeDetection
    - Publish
