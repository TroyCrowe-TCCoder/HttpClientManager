# Class Library — dev promotion pipeline
# Register this file as the downstream dev promotion pipeline in Azure DevOps.

trigger:
  branches:
    include:
      - dev

pr: none

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
- template: ../variables/common.yml

stages:
- template: ../templates/change-detection.yml
  parameters:
    mode: main
- template: ../templates/build.yml
- template: ../templates/test.yml
- template: ../templates/carry-forward.yml
- template: ../templates/failure.yml
  parameters:
    dependsOn:
    - ChangeDetection
    - Build
    - Test
    - CarryForward