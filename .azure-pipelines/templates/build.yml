# Stage template — restore, build, pack, and publish the package artifact.

stages:
- stage: Build
  displayName: Build
  dependsOn: ChangeDetection
  condition: |
    and(
      succeeded('ChangeDetection'),
      eq(dependencies.ChangeDetection.outputs['Detect.setvar.codeChanged'], 'true')
    )
  jobs:
  - job: BuildLibrary
    displayName: Restore, build, and pack
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: 10.0.x
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: $(solutionPath)

    - task: DotNetCoreCLI@2
      displayName: Build library
      inputs:
        command: build
        projects: $(solutionPath)
        arguments: --configuration $(buildConfiguration) --no-restore

    - task: DotNetCoreCLI@2
      displayName: Pack NuGet package
      inputs:
        command: pack
        packagesToPack: $(projectPath)
        configuration: $(buildConfiguration)
        outputDir: $(Build.ArtifactStagingDirectory)/nuget

    - task: PublishPipelineArtifact@1
      displayName: Publish package artifact
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/nuget
        artifactName: $(buildPackageArtifactName)
