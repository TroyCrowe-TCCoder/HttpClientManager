# auto-pr-chain.yml
# Reusable template — creates the next carry-forward PR in the delivery chain.
#
# Usage: Call from a PR-context pipeline after the current PR has been completed.
# The template reads the current PR title and description, creates a fresh carry-forward
# PR, and enables auto-complete.
#
# Parameters:
#   adoOrg        — Azure DevOps organization name  (e.g. tcrowe0170)
#   adoProject    — Azure DevOps project name        (e.g. MyProject)
#   repositoryId  — Repository name or GUID          (e.g. MyRepo)
#   sourceBranch  — Current branch being pushed      (e.g. dev)
#   targetBranch  — Next branch in the chain         (e.g. main)
#
# Authentication: System.AccessToken is used. The pipeline's job must set
# 'persistCredentials: true' and the build service identity must have
# 'Contribute to pull requests' permission on the repository.

parameters:
  - name: adoOrg
    type: string
  - name: adoProject
    type: string
  - name: repositoryId
    type: string
  - name: sourceBranch
    type: string
  - name: targetBranch
    type: string

steps:
  - task: PowerShell@2
    displayName: 'Create carry-forward PR → ${{ parameters.targetBranch }}'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    inputs:
      targetType: inline
      script: |
        $org        = '${{ parameters.adoOrg }}'
        $project    = '${{ parameters.adoProject }}'
        $repoId     = '${{ parameters.repositoryId }}'
        $source     = 'refs/heads/${{ parameters.sourceBranch }}'
        $target     = 'refs/heads/${{ parameters.targetBranch }}'
        $currentPrId = '$(System.PullRequest.PullRequestId)'
        $baseUrl    = "https://dev.azure.com/$org/$project/_apis/git/repositories/$repoId"
        $apiVersion = 'api-version=7.1'
        $headers    = @{
          Authorization  = "Bearer $env:SYSTEM_ACCESSTOKEN"
          'Content-Type' = 'application/json'
        }

        if ([string]::IsNullOrWhiteSpace($currentPrId)) {
          Write-Error 'System.PullRequest.PullRequestId was not provided. Carry-forward requires PR context.'
          exit 1
        }

        # ── Step 1: Read the completed PR that triggered this run ───────────────
        $currentPrUrl = "$baseUrl/pullrequests/$currentPrId?$apiVersion"
        $currentPr = Invoke-RestMethod -Uri $currentPrUrl -Headers $headers -Method Get
        $prTitle   = $currentPr.title
        $prDesc    = $currentPr.description

        Write-Host "Source PR #$currentPrId — '$prTitle'"

        # ── Step 2: Abandon any existing active PR on the same source→target ───
        $openUrl = "$baseUrl/pullrequests?searchCriteria.status=active" +
                   "&searchCriteria.sourceRefName=$source" +
                   "&searchCriteria.targetRefName=$target&$apiVersion"
        $openResponse = Invoke-RestMethod -Uri $openUrl -Headers $headers -Method Get

        if ($openResponse.count -gt 0) {
          foreach ($openPr in $openResponse.value) {
            $existingId = $openPr.pullRequestId
            Write-Host "Abandoning existing PR #$existingId from ${{ parameters.sourceBranch }} → ${{ parameters.targetBranch }}."
            $abandonBody = @{ status = 'abandoned' } | ConvertTo-Json -Depth 5
            Invoke-RestMethod -Uri "$baseUrl/pullrequests/$existingId?$apiVersion" -Headers $headers -Method Patch -Body $abandonBody | Out-Null
          }
        }

        # ── Step 3: Create the carry-forward PR ─────────────────────────────────
        $body = @{
          title         = $prTitle
          description   = $prDesc
          sourceRefName = $source
          targetRefName = $target
        } | ConvertTo-Json -Depth 5

        $createUrl      = "$baseUrl/pullrequests?$apiVersion"
        $createResponse = Invoke-RestMethod -Uri $createUrl -Headers $headers -Method Post -Body $body
        $newPrId        = $createResponse.pullRequestId
        $newPrUrl       = "https://dev.azure.com/$org/$project/_git/$repoId/pullrequest/$newPrId"

        Write-Host "##[section]Created PR #${newPrId}: $newPrUrl"

        # ── Step 4: Enable auto-complete ─────────────────────────────────────────
        # Retrieve the build service identity id from the PR creator field
        $creatorId = $createResponse.createdBy.id

        $acBody = @{
          autoCompleteSetBy = @{ id = $creatorId }
          completionOptions = @{
            mergeStrategy            = 'squash'
            deleteSourceBranch       = $false
            bypassPolicy             = $false
            bypassReason             = ''
            transitionWorkItems      = $false
            squashMerge              = $true
          }
        } | ConvertTo-Json -Depth 5

        $updateUrl = "$baseUrl/pullrequests/$($newPrId)?$apiVersion"
        try {
          Invoke-RestMethod -Uri $updateUrl -Headers $headers -Method Patch -Body $acBody | Out-Null
          Write-Host "Auto-complete enabled on PR #$newPrId."
        } catch {
          # Auto-complete may be rejected when required policies are not yet satisfied.
          # The PR is created and will complete once reviewers approve and gates pass.
          Write-Host "##[warning]Auto-complete could not be set on PR #$newPrId (policy gates pending): $($_.Exception.Message)"
        }
        Write-Host "Carry-forward PR ready: ${{ parameters.sourceBranch }} → ${{ parameters.targetBranch }} | $newPrUrl"
